<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>RDS (PixiJS)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <style>
        html, body { -ms-touch-action: none; background:#000; padding:0; border:0; margin:0; height:100%; overflow:hidden; }
        .egret-player { margin:auto; width:100%; height:100%; }
        canvas { touch-action: none; }
    </style>
</head>
<body>
    <div class="egret-player"></div>

    <!-- third-party runtimes (global UMD) -->
    <script src="lib/pixi.min.js"></script>
    <script src="lib/howler.min.js"></script>
    <!-- DragonBones 5.7 Pixi runtime (defines global dragonBones) -->
    <script src="lib/dragonBones.js"></script>

    <!-- egret -> pixi compatibility shim (defines global egret/RES; adapts dragonBones) -->
    <script src="lib/egret-shim.js"></script>

    <!-- game + logic code (IIFE; exposes window.Main) -->
    <script>var DEBUG = true;</script>
    <script src="lib/gamelogic.js"></script>

    <!-- bootstrap -->
    <script>
        window.addEventListener('load', function () {
            function start() {
                try {
                    window.__game = egret.runEgret({ entryClassName: 'Main', backgroundColor: 0x000000, antialias: true });
                } catch (e) {
                    console.error('runEgret failed', e);
                }
            }
            // Preload the bundled UI font (LXGW WenKai, subset) BEFORE starting the game:
            // PIXI rasterizes + caches text on first render, so a late-arriving web font
            // would leave already-drawn labels in the fallback face. One local 1.9MB woff2
            // (full GB2312 coverage) loads fast; a timeout guards against any stall.
            var started = false;
            function go() { if (started) return; started = true; start(); }
            try {
                var ff = new FontFace('LXGW WenKai', "url('fonts/LXGWWenKai-game.woff2')");
                ff.load().then(function (face) { document.fonts.add(face); go(); })
                         .catch(function (e) { console.warn('UI font load failed, using fallback', e); go(); });
            } catch (e) { go(); }
            setTimeout(go, 4000); // safety net so the game always starts
        });
    </script>
</body>
</html>
